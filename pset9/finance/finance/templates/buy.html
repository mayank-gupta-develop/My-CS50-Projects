{% extends "layout.html" %}

{% block title %}
    Buy
{% endblock %}

{% block main %}
    <h1 class="mb-4">Buy Stock</h1>

    <form action="/buy" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control" name="symbol" placeholder="Symbol (e.g. AAPL)" type="text" required>
        </div>

        <div class="mb-3">
            <input class="form-control" name="shares" placeholder="Number of shares" type="number" min="1" required>
        </div>

        <button class="btn btn-primary" type="submit">
            Buy
        </button>
    </form>
{% endblock %}
